let completedState = JSON.parse(localStorage.getItem('estimes_gbp_progress_v3') || '{}');

function copyText(text, btnElement) {
  navigator.clipboard.writeText(text).then(() => {
    const originalText = btnElement.innerHTML;
    btnElement.innerHTML = '✓ Copiado';
    btnElement.classList.add('copied');
    showToast();
    setTimeout(() => {
      btnElement.innerHTML = originalText;
      btnElement.classList.remove('copied');
    }, 1200);
  });
}

function showToast() {
  const toast = document.getElementById('toast');
  toast.style.display = 'block';
  setTimeout(() => {
    toast.style.display = 'none';
  }, 1200);
}

function toggleService(num) {
  completedState[num] = !completedState[num];
  localStorage.setItem('estimes_gbp_progress_v3', JSON.stringify(completedState));
  render();
}

function resetProgress() {
  if (confirm("¿Quieres reiniciar el progreso?")) {
    completedState = {};
    localStorage.removeItem('estimes_gbp_progress_v3');
    render();
  }
}

function render() {
  const container = document.getElementById('categoriesContainer');
  container.innerHTML = '';

  let totalCount = 0;
  let doneCount = 0;

  servicesData.forEach(cat => {
    const catSection = document.createElement('div');
    catSection.className = 'category-section';

    const catHeader = document.createElement('div');
    catHeader.className = 'category-header';
    catHeader.innerHTML = `
      <span class="category-badge ${cat.isPrimary ? 'primary-tag' : ''}">
        ${cat.categoryName}
        ${cat.isPrimary ? '<span class="primary-pill">PRIMARY</span>' : ''}
      </span>
      <span class="category-count">— ${cat.note} (${cat.services.length} servicios)</span>
    `;
    catSection.appendChild(catHeader);

    const grid = document.createElement('div');
    grid.className = 'services-grid';

    cat.services.forEach(s => {
      totalCount++;
      const isDone = !!completedState[s.num];
      if (isDone) doneCount++;

      const card = document.createElement('div');
      card.className = `service-card ${isDone ? 'completed' : ''}`;
      card.innerHTML = `
        <div class="card-top">
          <div class="title-group">
            <input type="checkbox" class="check-box" ${isDone ? 'checked' : ''} onchange="toggleService(${s.num})" title="Marcar como añadido">
            <span class="service-number">#${s.num}</span>
            <span class="service-title">${s.name}</span>
            ${s.googleBtn ? `<span class="google-pill">⚡ ${s.googleBtn}</span>` : ''}
          </div>
          <span class="price-pill">${s.price}</span>
        </div>

        <div class="field-row">
          <span class="field-label">Nombre</span>
          <span class="field-content">${s.name}</span>
          <button class="btn-copy" onclick="copyText('${escapeQuotes(s.name)}', this)">📋 Copiar Nombre</button>
        </div>

        <div class="field-row">
          <span class="field-label">Precio</span>
          <span class="field-content">${s.price}</span>
          <button class="btn-copy" onclick="copyText('${escapeQuotes(s.price)}', this)">📋 Copiar Precio</button>
        </div>

        <div class="field-row">
          <span class="field-label">Descripción</span>
          <span class="field-content desc">${s.desc}</span>
          <span class="char-badge">${s.chars} / 300 car.</span>
          <button class="btn-copy" onclick="copyText('${escapeQuotes(s.desc)}', this)">📋 Copiar Descripción</button>
        </div>
      `;
      grid.appendChild(card);
    });

    catSection.appendChild(grid);
    container.appendChild(catSection);
  });

  const percentage = Math.round((doneCount / totalCount) * 100);
  document.getElementById('progressFill').style.width = percentage + '%';
  document.getElementById('progressText').innerText = `${doneCount} / ${totalCount} Completados (${percentage}%)`;
}

function escapeQuotes(str) {
  return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

render();
</script>

</body>
</html>
