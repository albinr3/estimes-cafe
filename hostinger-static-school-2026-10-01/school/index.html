 fresh juices. Seating for regular dining is walk-in friendly. For parties of 6 or more, please call us ahead at (732) 669-7581 so our team can prepare seating, or inquire about private event venue rental for up to 35 guests."}},{"@type":"Question","name":"Is Estime's Café dog friendly or pet friendly for outdoor dining?","acceptedAnswer":{"@type":"Answer","text":"Yes! Well-behaved, leashed dogs are warmly welcomed in our outdoor patio seating area along Inman Avenue. Enjoy your fresh morning coffee, pancakes, and weekend brunch in the fresh air alongside your pet."}},{"@type":"Question","name":"Can I work on my laptop or study with coffee at Estime's Café?","acceptedAnswer":{"@type":"Answer","text":"Yes! On weekdays, we welcome remote workers, freelancers, and students looking for a cozy, inspiring atmosphere. We provide complimentary Wi-Fi, comfortable seating, and artisan espresso drinks, house-brewed coffees, and fresh breakfast to fuel your workday with active menu purchases."}},{"@type":"Question","name":"Where can I order brunch catering or breakfast party trays near me in Central NJ?","acceptedAnswer":{"@type":"Answer","text":"Estime's Café provides full-service breakfast and brunch catering platters across Colonia, Woodbridge, Clark, Edison, and throughout Middlesex and Union Counties. We deliver gourmet pancake stacks, brioche French toast trays, scrambled eggs, artisan breakfast sandwich platters (The Mayor, The Jimmy), and Creole shrimp & grits for corporate meetings, office breakfasts, bridal showers, baby showers, and family celebrations."}},{"@type":"Question","name":"Are there vegan, vegetarian, or keto-friendly options on your menu?","acceptedAnswer":{"@type":"Answer","text":"Yes. Our kitchen prepares dedicated keto-friendly omelets like The Beckler (egg whites, kale, goat cheese, avocado) and The Alfano (grilled chicken, kale, cheddar), alongside fresh garden salads, vegetable Creole grits bowls, and oat milk for coffee and espresso drinks. Most menu items can be adjusted to meet your dietary preferences."}}]}]}</script><header class="sticky top-0 z-40 bg-[#fbf8f2]/95 backdrop-blur-md border-b border-[#eee8de] transition-all"><div class="bg-brand-green text-brand-cream text-xs py-1.5 px-4 hidden md:block"><div class="max-w-container mx-auto flex justify-between items-center tracking-wide"><div class="flex items-center gap-6"><span class="flex items-center gap-1.5 font-medium"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin w-3.5 h-3.5 text-brand-gold-light"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>238 Inman Avenue, Colonia, NJ 07067</span><span class="flex items-center gap-1.5"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clock w-3.5 h-3.5 text-brand-gold-light"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Mon – Sat: 8:00 AM – 3:00 PM • Sun: 8:00 AM – 4:00 PM</span></div><div class="flex items-center gap-4 font-semibold tracking-wider"><a href="tel:7326697581" class="flex items-center gap-1.5 hover:text-white transition-colors"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone w-3.5 h-3.5 text-brand-gold-light"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 st, brunch, and lunch menu is available all day during operating hours.\"}},{\"@type\":\"Question\",\"name\":\"Where can I eat Sunday brunch near me in Colonia and Central New Jersey, and what are your weekend hours?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Estime's Café is located at 238 Inman Avenue in Colonia, NJ, serving weekend brunch every Saturday from 8:00 AM to 3:00 PM and Sunday from 8:00 AM to 4:00 PM. We welcome walk-in guests and families from Colonia, Woodbridge, Clark, Rahway, Edison, and Westfield for fresh, made-to-order breakfast favorites and signature weekend brunch specials.\"}},{\"@type\":\"Question\",\"name\":\"What are the most popular signature dishes to eat for brunch at Estime's Café?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Our top-rated brunch favorites include Chef Duke's famous Amaretto Brioche French Toast and fluffy Lemon Ricotta Pancakes ($16.95), savory Lobster Benedict ($36), Creamy Grits with Creole Shrimp or Catfish ($28–$36), and Honey Sriracha Fried Chicken \u0026 French Toast ($25). We also feature hearty breakfast sandwiches like The Mayor and keto-friendly specialty omelets like The Beckler.\"}},{\"@type\":\"Question\",\"name\":\"What kind of food does Estime's Café serve for breakfast, brunch, and lunch?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Executive Chef Duke Estime and co-founder Dumond Estime pair American comfort classics with Haitian and Caribbean recipes. Guest favorites include our famous Amaretto Brioche French Toast, Haitian Spicy Omelet, Creole Shrimp \u0026 Grits, Lemon Ricotta Pancakes, Honey Sriracha Chicken, and specialty coffee drinks.\"}},{\"@type\":\"Question\",\"name\":\"How can I order breakfast near me for delivery or pickup from Estime's Café?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"You can easily order fresh breakfast, brunch, and lunch for fast pickup or delivery directly on our website, or via DoorDash, Uber Eats, and Grubhub. We prepare all orders hot from scratch at 238 Inman Avenue, Colonia, NJ, delivering to homes and offices throughout Colonia, Woodbridge, Clark, Rahway, Edison, and Westfield. Call (732) 669-7581 for direct counter pickup.\"}},{\"@type\":\"Question\",\"name\":\"Can Estime's Café accommodate large groups, family breakfasts, and kids?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes! Estime's Café is family-friendly with comfortable indoor dining and menu favorites that kids love, including buttermilk pancakes, chocolate chip stacks, and fresh juices. Seating for regular dining is walk-in friendly. For parties of 6 or more, please call us ahead at (732) 669-7581 so our team can prepare seating, or inquire about private event venue rental for up to 35 guests.\"}},{\"@type\":\"Question\",\"name\":\"Is Estime's Café dog friendly or pet friendly for outdoor dining?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes! Well-behaved, leashed dogs are warmly welcomed in our outdoor patio seating area along Inman Avenue. Enjoy your fresh morning coffee, pancakes, and weekend brunch in the fresh air alongside your pet.\"}},{\"@type\":\"Question\",\"name\":\"Can I work on my laptop or study with coffee at Estime's Café?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes! On weekdays, we welcome remote workers, freelancers, and students looking for a cozy, inspiring atmosphere. We provide complimentary Wi-Fi, comfortable seating, and artisan espresso drinks, house-brewed coffees, and fresh breakfast to fuel your workday with active menu purchases.\"}},{\"@type\":\"Question\",\"name\":\"Where can I order brunch catering or breakfast party trays near me in Central NJ?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Estime's Café provides full-service breakfast and brunch catering platters across Colonia, Woodbridge, Clark, Edison, and throughout Middlesex and Union Counties. We deliver gourmet pancake stacks, brioche French toast trays, scrambled eggs, artisan breakfast sandwich platters (The Mayor, The Jimmy), and Creole shrimp \u0026 grits for corporate meetings, office breakfasts, bridal showers, baby showers, and family celebrations.\"}},{\"@type\":\"Question\",\"name\":\"Are there vegan, vegetarian, or keto-friendly options on your menu?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. Our kitchen prepares dedicated keto-friendly omelets like The Beckler (egg whites, kale, goat cheese, avocado) and The Alfano (grilled chicken, kale, cheddar), alongside fresh garden salads, vegetable Creole grits bowls, and oat milk for coffee and espresso drinks. Most menu items can be adjusted to meet your dietary preferences.\"}}]}]}"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"dlHR4auCncbHVhBLsLfVd\",\"p\":\"\",\"c\":[\"\",\"school\",\"\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"school\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/1efea5c2a56f867b.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"className\":\"__variable_0a80b4 __variable_f367f3\",\"children\":[[\"$\",\"$L2\",null,{\"src\":\"https://www.googletagmanager.com/gtag/js?id=G-WZTNVR2FKQ\",\"strategy\":\"afterInteractive\"}],[\"$\",\"$L2\",null,{\"id\":\"google-analytics\",\"strategy\":\"afterInteractive\",\"children\":\"window.dataLayer = window.dataLayer || [];\\nfunction gtag(){dataLayer.push(arguments);}\\ngtag('js', new Date());\\ngtag('config', 'G-WZTNVR2FKQ');\"}],[\"$\",\"body\",null,{\"className\":\"font-sans antialiased bg-brand-paper text-brand-text flex flex-col min-h-screen\",\"children\":[[\"$\",\"script\",null,{\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$3\"}}],\"$L4\",\"$L5\"]}]]}]]}],{\"children\":[\"school\",\"$L6\",{\"children\":[\"__PAGE__\",\"$L7\",{},null,false]},null,false]},n
